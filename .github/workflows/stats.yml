name: Generate Stats

# Braucht das Secret STATS_TOKEN (Personal Access Token classic
# mit den Rechten repo, read:user und user:email).
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jstrieb/github-stats
          path: gs

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        working-directory: gs
        run: zig build

      - name: Generate images
        working-directory: gs
        run: ./zig-out/bin/github-stats
        env:
          ACCESS_TOKEN: ${{ secrets.STATS_TOKEN }}
          EXCLUDE_PRIVATE: "false"
          SILENT: "true"
          MAX_RETRIES: "5"

      - name: Collect outputs
        run: |
          mkdir -p out-stats out-langs
          cp "$(find gs -name overview.svg -not -path '*/.git/*' | head -n 1)" out-stats/stats.svg
          cp "$(find gs -name languages.svg -not -path '*/.git/*' | head -n 1)" out-langs/languages.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: stats-output
          build_dir: out-stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: languages-output
          build_dir: out-langs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
